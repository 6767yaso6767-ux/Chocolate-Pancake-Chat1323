async function start(s){

let NK={},ROLES={},MR={},RX={},replyTo=null;
const isAdm=()=>PR[me.id]&&PR[me.id].is_admin;
const dname=u=>u==='ai'?uname(u):((cur&&cur.server&&NK[u])||uname(u));
const roleCol=u=>cur&&cur.server&&MR[u]&&ROLES[MR[u]]?ROLES[MR[u]].color:'';
async function loadSrvMeta(sid){NK={};ROLES={};MR={};const [a,b,c]=await Promise.all([sb.from('nicks').select('*').eq('server_id',sid),sb.from('roles').select('*').eq('server_id',sid),sb.from('member_roles').select('*').eq('server_id',sid)]);
  (a.data||[]).forEach(x=>NK[x.user_id]=x.nick);(b.data||[]).forEach(x=>ROLES[x.id]=x);(c.data||[]).forEach(x=>MR[x.user_id]=x.role_id)}
async function loadRx(){RX={};const ids=list.map(m=>m.id).filter(i=>/^[0-9a-f-]{36}$/.test(i));if(!ids.length||(cur&&cur.ai))return;const {data}=await sb.from('reactions').select('*').in('message_id',ids);(data||[]).forEach(r=>(RX[r.message_id]=RX[r.message_id]||[]).push(r))}
function rich(t){const f=document.createDocumentFragment();t.split(/(\|\|[^|]+\|\|)/g).forEach(x=>{if(/^\|\|[^|]+\|\|$/.test(x)){const s=el('span',x.slice(2,-2),'sp',()=>s.classList.toggle('on'));f.append(s)}else if(x)f.append(document.createTextNode(x))});return f}
async function saveImg(u){try{const b=await(await fetch(u)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resim'+(u.match(/\.\w{2,4}$/)||['.png'])[0];a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){window.open(u,'_blank')}}
function setReply(m){replyTo=m;$('rp').hidden=false;$('rp').textContent='↩ '+dname(m.user_id)+': '+(m.body||'[medya]').slice(0,50)+'  (iptal için tıkla)';$('rp').onclick=clearReply;$('in').focus()}
function clearReply(){replyTo=null;$('rp').hidden=true}
async function toggleRx(m,e){const mine=(RX[m.id]||[]).find(r=>r.user_id===me.id&&r.emoji===e);
  if(mine)await sb.from('reactions').delete().eq('message_id',m.id).eq('user_id',me.id).eq('emoji',e);else await sb.from('reactions').insert({message_id:m.id,user_id:me.id,emoji:e});await loadRx();render()}
function reactPick(m){modal(c=>{c.append(el('h3','Tepki'));const g=el('div');g.style.cssText='display:flex;flex-wrap:wrap;gap:4px';EM.slice(0,30).forEach(e=>g.append(el('button',e,'ic',()=>{close();toggleRx(m,e)})));c.append(g)})}
async function createThread(chid,title){const {data,error}=await sb.from('threads').insert({channel_id:chid,title,owner:me.id}).select().single();if(error){st('Konu açılamadı');return}close();openThread(data)}
function openThread(t){openRoom('th:'+t.id,'🧵 '+t.title,{server:S,chid:t.channel_id,thread:t.id})}
$('thb').onclick=async()=>{const {data}=await sb.from('threads').select('*').eq('channel_id',cur.chid).order('created',{ascending:false});const id=cur.chid;
  modal(c=>{c.append(el('h3','🧵 Konular'));const t=inp('text','Yeni konu başlığı');t.maxLength=80;c.append(t,el('button','Konu aç','sm',()=>t.value.trim()&&createThread(id,t.value.trim())));(data||[]).forEach(x=>c.append(el('button','🧵 '+x.title,'ch',()=>{close();openThread(x)})))})};
async function forumView(c){if(rch){sb.removeChannel(rch);rch=null}cur={room:null,title:'🗂️ '+c.name,server:S,chid:c.id,forum:true};$('tt').textContent=cur.title;$('bar').hidden=true;$('thb').hidden=true;$('vl').hidden=true;$('cb').hidden=true;
  const {data}=await sb.from('threads').select('*').eq('channel_id',c.id).order('created',{ascending:false}),log=$('log');log.innerHTML='';
  const t=inp('text','Yeni konu başlığı');t.maxLength=80;log.append(t,el('button','Konu aç','sm',()=>t.value.trim()&&createThread(c.id,t.value.trim())));
  (data||[]).forEach(x=>log.append(el('button','🧵 '+x.title+'  ·  '+uname(x.owner),'ch',()=>openThread(x))));if(!data||!data.length)log.append(el('div','Henüz konu yok. İlk konuyu sen aç!','empty'))}
function profCard(u){const p=PR[u];if(u==='ai'||!p)return;modal(c=>{const b=el('div');b.style.cssText='height:70px;border-radius:8px;background:'+(/^#[0-9a-f]{6}$/i.test(p.banner||'')?p.banner:'#5865f2');const pr=pres[u];
  c.append(b,avEl(u,64),el('h3',p.username+(p.pro?' ⭐PRO':'')+(p.is_admin?' 🛡️':'')),el('div',p.bio||'Biyografi yok.'),el('div',pr?(pr.act?'🎮 '+pr.act:STN[pr.st]):'Çevrimdışı'))})}
async function rulesGate(sv){if(!sv.rules||sv.owner===me.id)return;const {data}=await sb.from('server_members').select('user_id').eq('server_id',sv.id).eq('user_id',me.id).maybeSingle();if(data)return;
  lock=true;modal(c=>{const r=el('div',sv.rules);r.style.whiteSpace='pre-wrap';c.append(el('h3','👋 '+sv.name),el('div',sv.welcome||'Hoş geldin!'),el('h3','📜 Kurallar'),r,
    el('button','Kuralları okudum, kabul ediyorum','sm',async()=>{await sb.from('server_members').insert({server_id:sv.id,user_id:me.id});close()}),el('button','Ayrıl','sm dg',()=>{close();setMode('global')}))})}
async function srvSettings(){const sv=servers.find(x=>x.id===S);if(!sv)return;await loadSrvMeta(S);const own=sv.owner===me.id||isAdm();
  modal(c=>{c.append(el('h3','⚙️ '+sv.name));const nk=inp('text','Bu sunucudaki takma adın');nk.maxLength=24;nk.value=NK[me.id]||'';
    c.append(nk,el('button','Takma adı kaydet','sm',async()=>{const v=nk.value.trim(),{error}=v?await sb.from('nicks').upsert({server_id:S,user_id:me.id,nick:v}):await sb.from('nicks').delete().eq('server_id',S).eq('user_id',me.id);if(error){st('Kaydedilemedi');return}await loadSrvMeta(S);render();close()}));
    if(!own)return;
    const wl=el('textarea'),ru=el('textarea');wl.placeholder='Hoş geldin mesajı';wl.value=sv.welcome||'';ru.placeholder='Kurallar (doluysa yeni üyeler kabul etmek zorunda)';ru.value=sv.rules||'';[wl,ru].forEach(t=>t.style.cssText='background:var(--b3);border-radius:6px;padding:8px;min-height:70px;color:var(--tx);border:0');
    c.append(el('h3','👋 Hoş geldin ve 📜 kurallar'),wl,ru,el('button','Kaydet','sm',async()=>{const {error}=await sb.from('servers').update({welcome:wl.value,rules:ru.value}).eq('id',S);if(error){st('Kaydedilemedi');return}await loadServers();close()}));
    c.append(el('h3','🎨 Roller'));const rn=inp('text','Rol adı'),rc=inp('color','');rc.style.cssText='height:40px;padding:0';rc.value='#e91e63';
    c.append(rn,rc,el('button','Rol oluştur','sm',async()=>{if(!rn.value.trim())return;await sb.from('roles').insert({server_id:S,name:rn.value.trim(),color:rc.value});srvSettings()}));
    Object.values(ROLES).forEach(r=>{const x=el('div','● '+r.name);x.style.color=r.color;c.append(x)});
    if(Object.keys(ROLES).length){const us=el('select'),rs=el('select'),o0=el('option','(rolü kaldır)');o0.value='';rs.append(o0);Object.keys(PR).forEach(i=>{const o=el('option',PR[i].username);o.value=i;us.append(o)});Object.values(ROLES).forEach(r=>{const o=el('option',r.name);o.value=r.id;rs.append(o)});
      c.append(us,rs,el('button','Rolü ata','sm',async()=>{if(rs.value)await sb.from('member_roles').upsert({server_id:S,user_id:us.value,role_id:rs.value});else await sb.from('member_roles').delete().eq('server_id',S).eq('user_id',us.value);await loadSrvMeta(S);render();st('Güncellendi')}))}})}
$('sn').style.cursor='pointer';$('sn').onclick=()=>{if(mode==='server'&&S)srvSettings()};
if(window.speechSynthesis)speechSynthesis.getVoices();
drawRail();boot();
</script></body></html>
